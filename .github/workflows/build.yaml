name: Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm' # Added caching for faster installs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Run Vitest Tests
        run: npm run test:vi

      - name: Build
        run: npm run build

  cypress-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            spec: 'src/components/**/*.cy.{js,ts,jsx,tsx}'
          - shard: 2
            spec: 'src/spaces/**/*.cy.{js,ts,jsx,tsx}'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress Tests (shard ${{ matrix.shard }})
        env:
          CYPRESS_defaultCommandTimeout: '12000'
        run: npm run test:cy -- --spec '${{ matrix.spec }}'

      - name: Upload Cypress Screenshots
        if: always() # Run this step even if tests fail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypress-screenshots-shard-${{ matrix.shard }}
          path: |
            cypress/screenshots/
          retention-days: 7 # Keep artifacts for 7 days
          if-no-files-found: warn # Warn instead of fail if no screenshots found
