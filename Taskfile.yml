version: '3'

vars:
  # Variables for Docker image
  REGISTRY: '{{.REGISTRY | default (print "ghcr.io/openmcp-project") }}'
  IMAGE_NAME: mcp-ui-frontend
  IMAGE_TAG: '{{.TAG | default "latest"}}'
  DOCKER_IMAGE: '{{.REGISTRY}}/{{.IMAGE_NAME}}:{{.IMAGE_TAG}}'

  # Variables for OCM component
  OCM_COMPONENT_NAME: github.com/openmcp-project/ui
  OCM_COMPONENT_VERSION: '{{.OCM_COMPONENT_VERSION | default .IMAGE_TAG}}'
  OCM_PROVIDER: openmcp-project
  OCM_TARGET_REPO: '{{.OCM_TARGET_REPO | default (print .REGISTRY "/components") }}'
  OCM_OUTPUT_DIR: '{{.ROOT_DIR}}/.ctf'
  OCM_DESCRIPTOR: '{{.ROOT_DIR}}/ocm/component-descriptor.yaml'
  OCM_SIGNING_CONFIG: '{{.ROOT_DIR}}/ocm/signing.yaml'
  OCM_COMPONENT_REF: 'ctf::{{.OCM_OUTPUT_DIR}}//{{.OCM_COMPONENT_NAME}}:{{.OCM_COMPONENT_VERSION}}'

  # Backend Image Version
  BACKEND_IMAGE_URL: ghcr.io/openmcp-project/mcp-ui-backend
  BACKEND_IMAGE_VERSION: v0.7.1

  ROOT_DIR2: '{{.ROOT_DIR | trimSuffix "/common" | trimSuffix "/hack"}}'
  LOCALBIN: '{{ env "LOCALBIN" | default ( .LOCALBIN | default (print .ROOT_DIR2 "/.bin") ) }}'
  OCM: '{{ .OCM | default (print .LOCALBIN "/ocm") }}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:ocm:
    desc: 'Builds the ocm component. Usage: task build:ocm'
    deps:
      - install:ocm
    env:
      VERSION: '{{.OCM_COMPONENT_VERSION}}'
      IMAGE_VERSION: '{{.IMAGE_VERSION}}'
      COMPONENT_NAME: '{{.OCM_COMPONENT_NAME}}'
      PROVIDER: '{{.OCM_PROVIDER}}'
      BACKEND_IMAGE_URL: '{{.BACKEND_IMAGE_URL}}'
      BACKEND_IMAGE_VERSION: '{{.BACKEND_IMAGE_VERSION}}'
    cmds:
      - rm -rf {{.OCM_OUTPUT_DIR}}
      - |
        {{.OCM}} add cv \
          --constructor {{.OCM_DESCRIPTOR}} \
          --repository ctf::{{.OCM_OUTPUT_DIR}}
    vars:
      IMAGE_VERSION: '{{.IMAGE_VERSION | default (print .OCM_COMPONENT_VERSION)}}'

  sign:ocm:
    desc: 'Signs the ocm component keyless with Sigstore. It must have been built before. Usage: task sign:ocm'
    deps:
      - install:ocm
    cmds:
      - '{{.OCM}} sign cv --config {{.OCM_SIGNING_CONFIG}} {{.OCM_COMPONENT_REF}}'

  publish:ocm:
    desc: 'Publishes the ocm component to the registry. Fails if the version exists, unless OVERWRITE_COMPONENTS is "true". Usage: task publish:ocm'
    deps:
      - install:ocm
    env:
      OCM_TARGET_REF: '{{.OCM_TARGET_REPO}}//{{.OCM_COMPONENT_NAME}}:{{.OCM_COMPONENT_VERSION}}'
    cmds:
      # ocm replaces existing versions and has no flag to prevent it.
      - |
        if [ "${OVERWRITE_COMPONENTS:-false}" = "true" ]; then
          exit 0
        fi
        if {{.OCM}} get cv "$OCM_TARGET_REF"; then
          echo "$OCM_TARGET_REF already exists. Set OVERWRITE_COMPONENTS to 'true' to overwrite it." >&2
          exit 1
        fi
      - '{{.OCM}} transfer cv {{.OCM_COMPONENT_REF}} {{.OCM_TARGET_REPO}}'

  build:image:local:
    desc: 'Builds the docker image for local testing. Usage: task test:build-image TAG=v-local-test'
    cmds:
      - docker build -t {{.DOCKER_IMAGE}} .

  publish:image:local:
    desc: 'Publishes the docker image for local testing. Usage: task test:publish-image TAG=v-local-test'
    cmds:
      - docker push {{.DOCKER_IMAGE}}

  localbin:
    desc: '  Ensure that the folder specified in LOCALBIN exists.'
    run: once
    requires:
      vars:
        - LOCALBIN
    status:
      - test -d {{.LOCALBIN}}
    cmds:
      - 'echo "localbin: {{.LOCALBIN}}"'
      - mkdir -p {{.LOCALBIN}}
    internal: true

  headlamp:dev:
    desc: 'Bootstrap a local Headlamp kind cluster using the OCI helm chart and port-forward to http://localhost:8090. Usage: task headlamp:dev'
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/setup-headlamp-dev.sh"
      - task: headlamp:update

  headlamp:update:
    desc: 'Build local plugin sources and hot-sync them into the running headlamp-dev pod (no restart needed). Usage: task headlamp:update'
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/deploy-headlamp-plugins.sh"

  install:ocm:
    desc: '  Ensure that the ocm CLI is installed.'
    run: once
    requires:
      vars:
        - OCM
    deps:
      - localbin
    status:
      - 'test -x "{{.OCM}}"'
      - '"{{.OCM}}" version | grep -Fxq "  Version:  {{.OCM_VERSION | trimPrefix "v"}}"'
    vars:
      # renovate: datasource=github-releases depName=ocm packageName=open-component-model/open-component-model
      OCM_VERSION: '{{ env "OCM_VERSION" | default ( .OCM_VERSION | default "v0.25.0" ) }}'
    cmds:
      - 'curl -fsSL "https://github.com/open-component-model/open-component-model/releases/download/{{.OCM_VERSION}}/ocm-{{OS}}-{{ARCH}}" --output "{{.OCM}}"'
      - 'chmod +x "{{.OCM}}"'